project:
  type: book
  execute-dir: project

book:
  title: "金融工学の応用基礎"
  subtitle: "Coral Book ─ Rによる金融データ分析・価格評価・リスク計測"
  author: "Eiichi Horigome"
  cover-image: images/cover.png
  output-file: "coral-book"

  chapters:
    - index.qmd

    - part: "第I部 金融工学　均衡モデル"
      chapters:
        - part1_empirical/ch01_r_basics_tidyverse.qmd
        - part1_empirical/ch02_financial_data.qmd
        - part1_empirical/ch03_stock_data_time_series.qmd
        - part1_empirical/ch04_factor_models.qmd
        - part1_empirical/ch05_asset_pricing.qmd
        - part1_empirical/ch06_event_study.qmd
        - part1_empirical/ch07_machine_learning_factor_selection.qmd
        - part1_empirical/ch08_constrained_portfolio_optimization.qmd
        - part1_empirical/ch09_market_risk_var.qmd
        - part1_empirical/ch10_credit_risk_credit_var.qmd
        - part1_empirical/ch11_clo_tranche_valuation.qmd

    - part: "第II部 金融工学　無裁定モデル"
      chapters:
        - part2_quantive_riemann/ch01_deterministic_cashflow.qmd
        - part2_quantive_riemann/ch02_interest_rate_curves.qmd
        - part2_quantive_riemann/ch03_ois_swaps_multicurve.qmd
        - part2_quantive_riemann/ch04_black_model.qmd
        - part2_quantive_riemann/ch05_credit_risk_cds.qmd
        - part2_quantive_riemann/ch06_irs_calibration.qmd
        - part2_quantive_riemann/ch07_irs_rate_models.qmd
        - part2_quantive_riemann/ch08_early_redemption_models.qmd
        - part2_quantive_riemann/ch09_exotic_derivatives_prdc.qmd

    # 第III部「エンタープライゼーション」は Carmine Studio に移した（2026-11-15）。

  appendices:
    - appendix/appendix_a_state_reduction.qmd
    - appendix/appendix_b_automatic_differentiation.qmd

format:
  html:
    theme: [cosmo, coral.scss]
    toc: true
    code-fold: false
    number-sections: false

execute:
  eval: true
  echo: true
  warning: false
  message: false
  error: true
